<!DOCTYPE html>
<html lang="uz" class="notranslate" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arizalarni Tasdiqlash — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1a1a1a;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-orange: #f97316;
      --green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #8e99a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 3rem; }

    .header { margin-bottom: 2rem; }
    .title { font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); }

    .requests-grid { display: flex; flex-direction: column; gap: 1rem; }
    .request-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    
    .user-info { display: flex; flex-direction: column; gap: 4px; }
    .user-name { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .user-email { font-size: 0.85rem; color: var(--text-muted); }
    .user-role { font-size: 0.75rem; background: rgba(249, 115, 22, 0.15); color: var(--accent-orange); padding: 4px 10px; border-radius: 20px; font-weight: 700; width: fit-content; margin-top: 4px; }

    .btn-approve { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: var(--green); padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-approve:hover { background: var(--green); color: #fff; }

    .empty-state { padding: 4rem; text-align: center; color: var(--text-muted); background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--card-border); }
  </style>
</head>
<body>
  
  <div class="header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
    <div>
      <h1 class="title">Kutilayotgan So'rovlar (Pending Approvals)</h1>
      <p class="subtitle">Maktabingizga ulanishni xohlayotgan foydalanuvchilar ro'yxati</p>
    </div>
    <button onclick="document.getElementById('addUserModal').style.display='flex'" style="background:var(--accent-orange); color:#fff; border:none; padding:12px 24px; border-radius:12px; font-weight:700; cursor:pointer; box-shadow:0 4px 15px rgba(249,115,22,0.3);">+ Yangi Qo'shish</button>
  </div>

  <div class="requests-grid" id="requestsGrid">
    <!-- Dinamik ravishda chiziladi -->
    <div style="color:var(--text-muted)">Yuklanmoqda...</div>
  </div>

    <!-- Add User Modal -->
    <div id="addUserModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:100;">
      <div style="background:var(--card-bg); padding:2rem; border-radius:16px; border:1px solid var(--card-border); width:400px; display:flex; flex-direction:column; gap:1rem;">
        <h2 style="font-size:1.4rem; font-weight:800;">Yangi Foydalanuvchi Qo'shish</h2>
        <div id="addErrorMsg" style="display:none; color:#ef4444; font-size:0.85rem; font-weight:700;"></div>
        
        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:0.85rem; color:var(--text-muted);">Ism Familiya</label>
          <input type="text" id="addName" style="padding:10px; border-radius:8px; border:1px solid var(--card-border); background:#121212; color:#fff; outline:none;" />
        </div>
        
        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:0.85rem; color:var(--text-muted);">Email</label>
          <input type="email" id="addEmail" style="padding:10px; border-radius:8px; border:1px solid var(--card-border); background:#121212; color:#fff; outline:none;" />
        </div>

        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:0.85rem; color:var(--text-muted);">Parol</label>
          <input type="text" id="addPassword" style="padding:10px; border-radius:8px; border:1px solid var(--card-border); background:#121212; color:#fff; outline:none;" />
        </div>
        
        <div style="display:flex; flex-direction:column; gap:4px;">
          <label style="font-size:0.85rem; color:var(--text-muted);">Rol</label>
          <select id="addRole" style="padding:10px; border-radius:8px; border:1px solid var(--card-border); background:#121212; color:#fff; outline:none;">
            <option value="student">O'quvchi (Student)</option>
            <option value="curator">Kurator / O'qituvchi</option>
            <option value="manager">Menejer / Sotuvchi</option>
          </select>
        </div>
        
        <div style="display:flex; gap:1rem; margin-top:1rem;">
          <button onclick="document.getElementById('addUserModal').style.display='none'" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--card-border); background:transparent; color:#fff; cursor:pointer;">Bekor qilish</button>
          <button id="addBtn" onclick="adminCreateUser()" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--accent-orange); color:#fff; font-weight:700; cursor:pointer;">Qo'shish</button>
        </div>
      </div>
    </div>

  <script src="/auth_check.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadPendingUsers);

    async function adminCreateUser() {
      const name = document.getElementById('addName').value;
      const email = document.getElementById('addEmail').value;
      const password = document.getElementById('addPassword').value;
      const role = document.getElementById('addRole').value;
      const btn = document.getElementById('addBtn');
      const err = document.getElementById('addErrorMsg');
      
      err.style.display = 'none';
      btn.disabled = true;
      btn.innerText = 'Kutilmoqda...';
      
      try {
        const res = await fetch('/api/v1/users/admin-create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('access_token')
          },
          body: JSON.stringify({
            full_name: name,
            email: email,
            password: password,
            role: role
          })
        });
        
        const data = await res.json();
        if(res.ok) {
          alert("Foydalanuvchi muvaffaqiyatli qo'shildi!");
          document.getElementById('addUserModal').style.display = 'none';
        } else {
          err.innerText = typeof data.detail === 'string' ? data.detail : (data.detail?.[0]?.msg || "Xato yuz berdi");
          err.style.display = 'block';
        }
      } catch(e) {
        err.innerText = "Server bilan aloqa yo'q";
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "Qo'shish";
      }
    }

    async function loadPendingUsers() {
      const grid = document.getElementById('requestsGrid');
      const token = localStorage.getItem('access_token');
      if (!token) return;

      // JWT dan school_id ni ajratib olish
      let schoolId = null;
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        const payload = JSON.parse(jsonPayload);
        schoolId = payload.school_id;
      } catch(e) {}

      if (!schoolId) {
        grid.innerHTML = '<div class="empty-state">Maktab ID si topilmadi. Admin emassiz yoki tizimga qayta kiring.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/v1/schools/${schoolId}/pending-users`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const users = await res.json();

        if (res.ok) {
          if (users.length === 0) {
            grid.innerHTML = '<div class="empty-state">Hozircha hech qanday tasdiqlash uchun so\'rovlar yo\'q.</div>';
            return;
          }

          grid.innerHTML = '';
          users.forEach(u => {
            const card = document.createElement('div');
            card.className = 'request-card';
            card.innerHTML = `
              <div class="user-info">
                <div class="user-name">${u.full_name}</div>
                <div class="user-email">${u.email}</div>
                <div class="user-role">${u.role.toUpperCase()}</div>
              </div>
              <button class="btn-approve" onclick="approveUser('${schoolId}', '${u.id}', this)">✓ Tasdiqlash</button>
            `;
            grid.appendChild(card);
          });
        } else {
          grid.innerHTML = '<div class="empty-state">Xatolik yuz berdi: ' + JSON.stringify(users) + '</div>';
        }
      } catch(err) {
        grid.innerHTML = '<div class="empty-state">Server bilan aloqa yo\'q.</div>';
      }
    }

    async function approveUser(schoolId, userId, btnEl) {
      const token = localStorage.getItem('access_token');
      btnEl.innerText = 'Kutilmoqda...';
      btnEl.disabled = true;

      try {
        const res = await fetch(`/api/v1/schools/${schoolId}/approve/${userId}`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
          alert('Foydalanuvchi muvaffaqiyatli tasdiqlandi!');
          btnEl.closest('.request-card').remove();
          
          // Check if empty
          if (document.querySelectorAll('.request-card').length === 0) {
             document.getElementById('requestsGrid').innerHTML = '<div class="empty-state">Hozircha hech qanday tasdiqlash uchun so\'rovlar yo\'q.</div>';
          }
        } else {
          alert('Tasdiqlashda xatolik yuz berdi.');
          btnEl.innerText = '✓ Tasdiqlash';
          btnEl.disabled = false;
        }
      } catch(e) {
        alert('Tarmoq xatosi.');
        btnEl.innerText = '✓ Tasdiqlash';
        btnEl.disabled = false;
      }
    }
  </script>
</body>
</html>
