<!DOCTYPE html>
<html lang="uz" class="notranslate" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uy Vazifalari — dev.exode.biz/manage/homeworks/1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d0f12;
      --sidebar-bg: #13151b;
      --card-bg: #181a21;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-orange: #f97316;
      --text-main: #f8fafc;
      --text-muted: #8e99a8;
      --status-yellow: #eab308;
      --status-green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: 84px; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 0.6rem; overflow-y: auto; flex-shrink: 0; }
    .sidebar-brand { width: 44px; height: 44px; background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(249, 115, 22, 0.2)); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem; }

    .nav-item { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.68rem; font-weight: 600; transition: all 0.2s; }
    .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.04); }
    .nav-item.active { color: var(--accent-cyan); background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3); }
    .svg-icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* MAIN CONTENT */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg-dark); }
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 1.1rem 2rem; border-bottom: 1px solid var(--card-border); }
    .header-left { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 700; }

    .status-pills { display: flex; gap: 8px; }
    .pill { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); background: var(--card-bg); border: 1px solid var(--card-border); cursor: pointer; }
    .pill.active { color: #fff; background: var(--accent-cyan); border-color: var(--accent-cyan); }

    .homework-container { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }

    /* TABLE */
    .table-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 1rem 1.25rem; background: rgba(255,255,255,0.02); color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--card-border); }
    td { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--card-border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }

    .badge-status { padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .status-pending { background: rgba(234, 179, 8, 0.15); color: var(--status-yellow); border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-approved { background: rgba(16, 185, 129, 0.15); color: var(--status-green); border: 1px solid rgba(16, 185, 129, 0.3); }

    .btn-action { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem; width: 480px; display: flex; flex-direction: column; gap: 1rem; }
    .modal-input { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 0.9rem; outline: none; }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <a href="/" class="sidebar-brand">
      <svg class="svg-icon" style="stroke:var(--accent-cyan)" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </a>

    <a href="/manage/dashboard" class="nav-item">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Bosh sahifa</span>
    </a>

    <a href="/courses" class="nav-item">
      <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      <span>Katalog</span>
    </a>

    <a href="/payments" class="nav-item">
      <svg class="svg-icon" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      <span>To'lovlar</span>
    </a>

    <a href="/homework" class="nav-item active">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/></svg>
      <span>Amaliyot</span>
    </a>

    <a href="/analytics" class="nav-item">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Foydalanuvchilar</span>
    </a>

    <a href="/customization" class="nav-item">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="m4 6 8-4 8 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M12 22V12"/></svg>
      <span>Maktabim</span>
    </a>
  </aside>

  <!-- MAIN WRAPPER -->
  <main class="main-wrapper">
    <header class="top-header">
      <div class="header-left">
        <svg class="svg-icon" style="stroke:var(--accent-cyan)" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="8" y="2" rx="1"/></svg>
        <span>1. Practice & Homework Submissions (Uy Vazifalari)</span>
      </div>

      <div class="status-pills">
        <div class="pill active">Barchasi</div>
        <div class="pill">Tekshiruvda</div>
        <div class="pill">Qabul Qilingan</div>
      </div>
    </header>

    <div class="homework-container">
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>O'quvchi</th>
              <th>Dars & Topshiriq</th>
              <th>Yuborilgan Matn</th>
              <th>Status</th>
              <th>Baho</th>
              <th>Amal</th>
            </tr>
          </thead>
          <tbody id="homeworkTableBody">
            <!-- DYNAMICALLY POPULATED VIA API -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- GRADING MODAL -->
  <div class="modal-overlay" id="gradingModal">
    <div class="modal-card">
      <h3 style="font-size:1.1rem;font-weight:700">Uy Vazifasini Baholash</h3>
      <input type="hidden" id="modalSubId" />
      
      <div>
        <label style="font-size:0.8rem;color:var(--text-muted)">Baho (1 dan 5 gacha)</label>
        <input type="number" min="1" max="5" id="modalGradeInput" class="modal-input" style="width:100%" value="5" />
      </div>

      <div>
        <label style="font-size:0.8rem;color:var(--text-muted)">Ustoz Izohi (Feedback)</label>
        <textarea id="modalFeedbackInput" class="modal-input" rows="3" style="width:100%" placeholder="Izoh yozing..."></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button onclick="closeModal()" style="background:none;border:1px solid var(--card-border);color:var(--text-muted);padding:8px 16px;border-radius:8px;cursor:pointer">Bekor Qilish</button>
        <button onclick="submitGrade()" class="btn-action">💾 Baholashni Saqlash</button>
      </div>
    </div>
  </div>

  <script>
    async function loadSubmissions() {
      try {
        const res = await fetch('/api/v1/homeworks');
        const data = await res.json();
        const tbody = document.getElementById('homeworkTableBody');
        tbody.innerHTML = '';

        data.forEach(item => {
          const tr = document.createElement('tr');
          const isPending = item.status === 'Sent for Review';
          const statusBadge = isPending 
            ? `<span class="badge-status status-pending">● Tekshiruvda</span>`
            : `<span class="badge-status status-approved">✓ Qabul qilingan</span>`;

          tr.innerHTML = `
            <td style="font-weight:700">${item.student_name}</td>
            <td><div>${item.course_title}</div><div style="font-size:0.78rem;color:var(--text-muted)">${item.lesson_title}</div></td>
            <td style="max-width:280px">${item.submission_text}</td>
            <td>${statusBadge}</td>
            <td style="font-weight:800;color:var(--accent-orange)">${item.grade ? item.grade + ' / 5' : '-'}</td>
            <td><button class="btn-action" onclick="openGradeModal(${item.id})">Baholash</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch(e) {
        console.error(e);
      }
    }

    function openGradeModal(id) {
      document.getElementById('modalSubId').value = id;
      document.getElementById('gradingModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('gradingModal').style.display = 'none';
    }

    async function submitGrade() {
      const id = parseInt(document.getElementById('modalSubId').value);
      const grade = parseInt(document.getElementById('modalGradeInput').value);
      const feedback = document.getElementById('modalFeedbackInput').value;

      try {
        await fetch('/api/v1/homeworks/grade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            submission_id: id,
            grade: grade,
            status: 'Approved',
            feedback: feedback
          })
        });
        closeModal();
        loadSubmissions();
      } catch(e) {
        alert('Xatolik yuz berdi!');
      }
    }

    window.onload = loadSubmissions;
  </script>
</body>
</html>
