<!DOCTYPE html>
<html lang="uz" class="notranslate" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Exode.biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-orange: #f97316;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; }

    .login-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 2.5rem; width: 420px; display: flex; flex-direction: column; gap: 1.25rem; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .brand-logo { font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; text-decoration: none; }
    .text-gradient { background: linear-gradient(135deg, #06b6d4, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.88rem; font-weight: 600; color: var(--text-dim); }
    .form-input { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-input:focus { border-color: var(--accent-orange); }

    .btn-submit { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="/" class="brand-logo">
      <span>⚡ exode<span class="text-gradient">.biz</span></span>
    </a>
    
    <div style="text-align:center;margin-bottom:0.5rem">
      <h2 style="font-size:1.35rem;font-weight:800">Tizimga Kirish</h2>
      <p style="font-size:0.82rem;color:var(--text-dim)">Exode platformasi shaxsiy kabinetiga kiring</p>
    </div>

    <div id="errorMessage" style="display:none; background:rgba(239, 68, 68, 0.15); border:1px solid rgba(239, 68, 68, 0.3); color:#ef4444; padding:12px; border-radius:10px; font-size:0.85rem; font-weight:700; text-align:center; margin-bottom:1rem"></div>

    <form onsubmit="handleLogin(event)" style="display:flex;flex-direction:column;gap:1.25rem">
      <div class="form-group">
        <label class="form-label">Email Manzilingiz</label>
        <input type="email" id="emailInput" class="form-input" value="usa20070302@gmail.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Parolingiz</label>
        <input type="password" id="passwordInput" class="form-input" value="password123" required />
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">🚀 Tizimga Kirish</button>
    </form>

    <div style="text-align:center;font-size:0.85rem;color:var(--text-dim)">
      Akkountingiz yo'qmi? <a href="/register" style="color:var(--accent-cyan);font-weight:700;text-decoration:none">Ro'yxatdan o'ting</a>
    </div>
  </div>

  <script>
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const errorDiv = document.getElementById('errorMessage');
      const btn = document.getElementById('submitBtn');
      
      errorDiv.style.display = 'none';
      btn.innerText = 'Kutilmoqda...';
      btn.disabled = true;

      try {
        const params = new URLSearchParams();
        params.append('username', email);
        params.append('password', password);

        const res = await fetch('/api/v1/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('access_token', data.access_token);
          const payload = parseJwt(data.access_token);
          
          if (payload && payload.role === 'student') window.location.href = '/training/courses';
          else if (payload && payload.role === 'curator') window.location.href = '/manage/curator';
          else if (payload && payload.role === 'manager') window.location.href = '/manage/manager';
          else window.location.href = '/manage/dashboard';
        } else {
          let errorMsg = "Email yoki parol noto'g'ri";
          if (typeof data.detail === 'string') {
            errorMsg = data.detail;
          } else if (Array.isArray(data.detail) && data.detail.length > 0) {
            errorMsg = data.detail[0].msg;
          } else if (typeof data.detail === 'object' && data.detail !== null) {
            errorMsg = JSON.stringify(data.detail);
          }
          errorDiv.innerText = errorMsg;
          errorDiv.style.display = 'block';
        }
      } catch(err) {
        errorDiv.innerText = "Server bilan aloqa yo'q";
        errorDiv.style.display = 'block';
      } finally {
        btn.innerText = '🚀 Tizimga Kirish';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
