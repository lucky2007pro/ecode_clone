<!DOCTYPE html>
<html lang="uz" class="notranslate" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maktab Ochish — Exode.biz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-orange: #f97316;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0; }

    .register-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 2.5rem; width: 460px; display: flex; flex-direction: column; gap: 1.25rem; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .brand-logo { font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; text-decoration: none; }
    .text-gradient { background: linear-gradient(135deg, #06b6d4, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.88rem; font-weight: 600; color: var(--text-dim); }
    .form-input { background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-input:focus { border-color: var(--accent-orange); }

    .btn-submit { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
  </style>
</head>
<body>

  <div class="register-card">
    <a href="/" class="brand-logo">
      <span>⚡ exode<span class="text-gradient">.biz</span></span>
    </a>
    
    <div style="text-align:center;margin-bottom:0.5rem">
      <h2 style="font-size:1.35rem;font-weight:800">Yangi Onlayn Maktab Ochish</h2>
      <p style="font-size:0.82rem;color:var(--text-dim)">Exode LMS va ERP boshqaruv panelini 1 daqiqada yoqing</p>
    </div>

    <form onsubmit="handleRegister(event)" style="display:flex;flex-direction:column;gap:1.25rem">
      <div class="form-group">
        <label class="form-label">Maktabingiz Nomi</label>
        <input type="text" id="schoolNameInput" class="form-input" value="dev" required />
      </div>

      <div class="form-group">
        <label class="form-label">Ismingiz va Familiyangiz</label>
        <input type="text" id="fullNameInput" class="form-input" value="Hojiakbar Hayrullayev" required />
      </div>

      <div class="form-group">
        <label class="form-label">Email Manzilingiz</label>
        <input type="email" id="emailInput" class="form-input" value="usa20070302@gmail.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">Parolingiz</label>
        <input type="password" id="passwordInput" class="form-input" value="password123" required />
      </div>

      <button type="submit" class="btn-submit">⚡ Onlayn Maktabni Yaratish</button>
    </form>

    <div style="text-align:center;font-size:0.85rem;color:var(--text-dim)">
      Akkountingiz bormi? <a href="/login" style="color:var(--accent-cyan);font-weight:700;text-decoration:none">Tizimga kirish</a>
    </div>
  </div>

  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const schoolName = document.getElementById('schoolNameInput').value;
      const fullName = document.getElementById('fullNameInput').value;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const res = await fetch('/api/v1/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            email: email,
            password: password,
            school_name: schoolName,
            role: 'owner'
          })
        });

        window.location.href = '/manage/school/settings/basic';
      } catch(err) {
        window.location.href = '/manage/school/settings/basic';
      }
    }
  </script>
</body>
</html>
