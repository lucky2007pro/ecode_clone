version: "3.9"

services:
  # ==========================================
  # 1. FRONTEND (React App on Port 3000)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exode_frontend
    ports:
      - "3000:3000"
    restart: always

  # ==========================================
  # 2. INFRATUZILMA (DB, Cache & Message Queue)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: exode_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hojiakbar
      POSTGRES_DB: exode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exode_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: exode_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. API GATEWAY (Port 8000)
  # ==========================================
  gateway:
    build:
      context: ./backend
      dockerfile: services/gateway/Dockerfile
    container_name: exode_gateway
    command: uvicorn services.gateway.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - SCHOOL_SERVICE_URL=http://school-service:8002
      - COURSE_SERVICE_URL=http://course-service:8003
    depends_on:
      - auth-service
      - school-service
      - course-service

  # ==========================================
  # 4. MIKROSERVISLAR & WORKERLAR
  # ==========================================
  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    container_name: exode_auth_service
    command: uvicorn services.auth-service.app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  school-service:
    build:
      context: ./backend
      dockerfile: services/school-service/Dockerfile
    container_name: exode_school_service
    command: uvicorn services.school-service.app.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy

  course-service:
    build:
      context: ./backend
      dockerfile: services/course-service/Dockerfile
    container_name: exode_course_service
    command: uvicorn services.course-service.app.main:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy

  video-integration-service:
    build:
      context: ./backend
      dockerfile: services/video-integration-service/Dockerfile
    container_name: exode_video_service
    command: uvicorn services.video-integration-service.app.main:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  crm-integration-service:
    build:
      context: ./backend
      dockerfile: services/crm-integration-service/Dockerfile
    container_name: exode_crm_service
    command: uvicorn services.crm-integration-service.app.main:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

  crm-worker:
    build:
      context: ./backend
      dockerfile: services/crm-integration-service/Dockerfile
    container_name: exode_crm_worker
    command: celery -A services.crm-integration-service.app.celery_app worker -Q crm_queue -l info
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - rabbitmq
      - redis

  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    container_name: exode_payment_service
    command: uvicorn services.payment-service.app.main:app --host 0.0.0.0 --port 8006 --reload
    ports:
      - "8006:8006"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    container_name: exode_notification_service
    command: uvicorn services.notification-service.app.main:app --host 0.0.0.0 --port 8007 --reload
    ports:
      - "8007:8007"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db

  notification-worker:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    container_name: exode_notification_worker
    command: celery -A services.notification-service.app.celery_app worker -Q notify_queue -l info
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - rabbitmq
      - redis

  progress-service:
    build:
      context: ./backend
      dockerfile: services/progress-service/Dockerfile
    container_name: exode_progress_service
    command: uvicorn services.progress-service.app.main:app --host 0.0.0.0 --port 8008 --reload
    ports:
      - "8008:8008"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=hojiakbar
      - DB_NAME=exode_db

volumes:
  postgres_data:
